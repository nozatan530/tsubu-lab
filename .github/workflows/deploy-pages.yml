# main に push（マージ）されたら、ビルドして GitHub Pages に公開する
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、後から来たものを待たせて順番に公開する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json をリポジトリに置いていないため npm ci ではなく npm install を使う
      - name: 依存パッケージのインストール
        run: npm install --no-audit --no-fund

      # 判定チェックが通らないものは公開しない
      - name: ミッションの判定と濃度計算のチェック（npm run check）
        run: npm run check

      - name: ビルド（npm run build）
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
